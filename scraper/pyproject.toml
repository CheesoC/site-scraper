[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-scraper"
version = "0.1.0"
description = "Erfasst eine Website (Seiten, Navigation, Inhalte, Bilder) als standardisiertes Content-Archiv (Schema v1.0)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "crawl4ai>=0.7",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "httpx>=0.27",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "referencing>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
site-scraper = "scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: tests that start a real Chromium via Crawl4AI"]
